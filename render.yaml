services:
  - type: web
    name: deepfake-detection-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: deepfake-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1